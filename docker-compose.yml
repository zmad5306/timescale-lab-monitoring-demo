services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: labmonitor-timescaledb
    environment:
      POSTGRES_DB: labmonitor
      POSTGRES_USER: labmonitor
      POSTGRES_PASSWORD: labmonitor
    ports:
      - "5432:5432"
    volumes:
      - labmonitor-db:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labmonitor -d labmonitor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  labmonitor-db:
